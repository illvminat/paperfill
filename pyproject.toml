[project]
name = "paperfill"
version = "0.1.0"
description = "Paper-trading harness for Polymarket: trade-history replay, fee-exact fills, risk envelope, decision journal, metrics report. No live trading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "illvminat" }]
keywords = ["polymarket", "prediction-markets", "paper-trading", "backtesting", "market-making"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.141.1",
  "polymarket-client==0.10.0",
  "uvicorn[standard]>=0.53.0",
]

[project.scripts]
paperfill = "paperfill.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "pytest-cov>=6",
  "python-multipart>=0.0.20",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperfill"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# inline HTML/CSS template: wrapping CSS rules would not make them more readable
"src/paperfill/dashboard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "live: talks to the public Polymarket API over the network (skipped in CI by default)",
]

[tool.coverage.run]
source = ["paperfill"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
